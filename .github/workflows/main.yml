name: CI

on: [pull_request]

jobs:
  check-for-cc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm run build

      - name: check-for-cc
        id: hello
        uses: ./
