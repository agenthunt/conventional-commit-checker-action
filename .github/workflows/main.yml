name: CI

on: [pull_request]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build action
        run: npm run build

  check-for-cc:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Test action on this PR
        uses: ./
        with:
          pr-title-regex: '^(feat|fix|chore|docs|test|ci|refactor|style|perf|build|revert)(\(.+\))?: .+$'
